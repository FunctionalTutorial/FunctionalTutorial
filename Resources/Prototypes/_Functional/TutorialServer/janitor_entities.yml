- type: entity
  parent: FloorDrain
  id: TutorialJanitorCloggedDrain
  suffix: Tutorial, Clogged
  components:
  # A stock drain destroys buffer volume every second, so a pre-filled one is no longer full
  # by the time the player arrives and the plunger verb refuses.
  # autoDrain stays off so the overflow puddles remain for the mop, instead of the
  # freshly cleared buffer drinking them before the player can.
  - type: Drain
    unitsDestroyedPerSecond: 0
    autoDrain: false
  - type: Solution
    id: drainBuffer
    solution:
      maxVol: 960
      reagents:
      - ReagentId: Water
        Quantity: 960
  - type: Tag
    tags:
    - TutorialJanitorCloggedDrain

