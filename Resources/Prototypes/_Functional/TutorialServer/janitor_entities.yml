- type: entity
  parent: TutorialPracticeMob
  id: TutorialJanitorAssistant
  name: assistant
  suffix: Tutorial, Janitor, Slip
  components:
  - type: Tag
    tags:
    - TutorialPracticeMob
    - TutorialJanitorAssistant
    - DoorBumpOpener
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: TutorialFollowCompound
    blackboard:
      FollowCloseRange: !type:Single
        0.4
      FollowRange: !type:Single
        0.8
      NavInteract: !type:Bool
        true
      NavDoors: !type:Bool
        true
      MinimumIdleTime: !type:Single
        0.5
      MaximumIdleTime: !type:Single
        1.5
  # Spawn is one end of the hall. The slip mark is the other, and the soap is between them.
  # Each crossing slips, then they wait and walk back, so a miss is not the only chance.
  - type: TutorialSlipLoop
    endTag: TutorialJanitorSlipMark
    minWait: 5
    maxWait: 10

