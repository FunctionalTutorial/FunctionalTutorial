- type: tutorialRole
  id: TutorialJanitor
  job: Passenger
  stub: false
  liveTutorial: true
  simplifiedEnvironment: true
  category: Service
  name: tutorial-janitor-name
  map: /Maps/_Functional/TutorialServer/Roles/Janitor.yml
  guidebook: Janitorial
  chamberEntryPads: false
  mentorName: N.A.N.C.I.
  mentorEntity: TutorialHoloMentorJanitor
  mentorMode: Holopad
  mentorFollows: false
  mentorSpawnOffset: 2, 0
  autoOpenGuide: false
  goals:
  - id: closet
    title: tutorial-janitor-goal-closet
    subGoals:
    - id: welcome
      text: tutorial-janitor-sg-welcome
      complete: Acknowledge
      autoAdvanceSeconds: 3
    - id: wear-galoshes
      text: tutorial-janitor-sg-wear-galoshes
      controlHint: tutorial-janitor-control-wear-galoshes
      complete: WearItem
      entity: ClothingShoesGaloshes
      slot: shoes

  - id: spill
    title: tutorial-janitor-goal-spill
    enterRoom: 1
    subGoals:
    - id: dip-mop
      text: tutorial-janitor-sg-dip-mop
      controlHint: tutorial-janitor-control-dip-mop
      complete: TaggedSolution
      tag: TutorialJanitorMop
      reagent: Water
      minAmount: 1
    - id: clear-one
      text: tutorial-janitor-sg-clear-one
      controlHint: tutorial-janitor-control-clear-one
      complete: PuddleCleared
      marker: janitor-spill-one
      # A mop swaps the fuel for water. Water is slow to evaporate, so the tile does not have to dry.
      reagent: WeldingFuel
    - id: wring-tip
      text: tutorial-janitor-sg-wring-tip
      complete: Acknowledge
      autoAdvanceSeconds: 3
    - id: clear-rest
      text: tutorial-janitor-sg-clear-rest
      controlHint: tutorial-janitor-control-clear-rest
      complete: PuddleCleared
      marker: janitor-spill
      reagent: WeldingFuel

  - id: trolley
    title: tutorial-janitor-goal-trolley
    enterRoom: 2
    subGoals:
    - id: pull-cart
      text: tutorial-janitor-sg-pull-cart
      controlHint: tutorial-janitor-control-pull-cart
      complete: PullTag
      tag: TutorialJanitorTrolley
    - id: empty-cart
      text: tutorial-janitor-sg-empty-cart
      controlHint: tutorial-janitor-control-empty-cart
      complete: TaggedSolution
      tag: TutorialJanitorTrolley
      maxAmount: 0
    - id: refill-cart
      text: tutorial-janitor-sg-refill-cart
      controlHint: tutorial-janitor-control-refill-cart
      complete: TaggedSolution
      tag: TutorialJanitorTrolley
      reagent: Water
      # One pour from the bucket. Filling the whole tank is several trips and is not the lesson.
      minAmount: 60
    - id: insert-mop
      text: tutorial-janitor-sg-insert-mop
      controlHint: tutorial-janitor-control-insert-mop
      complete: ContainerHasEntityCount
      tag: TutorialJanitorTrolley
      slot: mop_slot
      entity: TutorialJanitorMop
      minCount: 1
    - id: remove-mop
      text: tutorial-janitor-sg-remove-mop
      controlHint: tutorial-janitor-control-remove-mop
      complete: HoldItem
      entity: TutorialJanitorMop

  - id: drain
    title: tutorial-janitor-goal-drain
    enterRoom: 3
    subGoals:
    - id: plunge
      text: tutorial-janitor-sg-plunge
      controlHint: tutorial-janitor-control-plunge
      complete: TaggedSolution
      tag: TutorialJanitorCloggedDrain
      maxAmount: 0

  - id: soap
    title: tutorial-janitor-goal-soap
    enterRoom: 4
    subGoals:
    - id: step-soap
      text: tutorial-janitor-sg-step-soap
      controlHint: tutorial-janitor-control-step-soap
      complete: ReachMarker
      marker: janitor-soap
    - id: watch-slip
      text: tutorial-janitor-sg-watch-slip
      controlHint: tutorial-janitor-control-watch-slip
      complete: PracticeMobSlipped
    - id: pickup-soap
      text: tutorial-janitor-sg-pickup-soap
      controlHint: tutorial-janitor-control-pickup-soap
      complete: CarryItem
      entity: TutorialJanitorSoap

  - id: trash
    title: tutorial-janitor-goal-trash
    enterRoom: 5
    subGoals:
    # A click on a tile sweeps. The use key belts the bag, so it is not a step.
    # MinCount is how many loose pieces to clear. The spare is whatever was already
    # gone when the beat started, so picking the pile up by hand cannot stall it.
    - id: fill-bag
      text: tutorial-janitor-sg-fill-bag
      controlHint: tutorial-janitor-control-fill-bag
      complete: LooseTrashCleared
      tag: Trash
      minCount: 15
    - id: flush
      text: tutorial-janitor-sg-flush
      controlHint: tutorial-janitor-control-flush-bag
      complete: DisposalEngaged
      tag: TutorialJanitorDisposal

  - id: lights
    title: tutorial-janitor-goal-lights
    enterRoom: 6
    subGoals:
    - id: take-replacer
      text: tutorial-janitor-sg-take-replacer
      controlHint: tutorial-janitor-control-take-replacer
      complete: HoldTag
      tag: LightReplacer
    - id: take-tubes
      text: tutorial-janitor-sg-take-tubes
      controlHint: tutorial-janitor-control-take-tubes
      complete: HoldItem
      entity: BoxLighttube
    - id: load-replacer
      text: tutorial-janitor-sg-load-replacer
      controlHint: tutorial-janitor-control-load-replacer
      complete: LightReplacerLoaded
      tag: LightReplacer
    - id: fix-first
      text: tutorial-janitor-sg-fix-first
      controlHint: tutorial-janitor-control-fix-first
      complete: LightFixed
      tag: TutorialJanitorLightA
    - id: fix-second
      text: tutorial-janitor-sg-fix-second
      controlHint: tutorial-janitor-control-fix-second
      complete: LightFixed
      tag: TutorialJanitorLightB

  - id: rust
    title: tutorial-janitor-goal-rust
    enterRoom: 7
    subGoals:
    - id: take-brush
      text: tutorial-janitor-sg-take-brush
      controlHint: tutorial-janitor-control-take-brush
      complete: HoldTag
      tag: WireBrush
    - id: scrub-one
      text: tutorial-janitor-sg-scrub-one
      controlHint: tutorial-janitor-control-scrub-one
      complete: TargetAbsent
      tag: TutorialJanitorRustFirst
    - id: scrub-rest
      text: tutorial-janitor-sg-scrub-rest
      controlHint: tutorial-janitor-control-scrub-rest
      complete: TargetAbsent
      tag: TutorialJanitorRust

  - id: graffiti
    title: tutorial-janitor-goal-graffiti
    enterRoom: 8
    subGoals:
    - id: take-spray
      text: tutorial-janitor-sg-take-spray
      controlHint: tutorial-janitor-control-take-spray
      complete: HoldItem
      entity: SprayBottleSpaceCleaner
    - id: spray-one
      text: tutorial-janitor-sg-spray-one
      controlHint: tutorial-janitor-control-spray-one
      complete: CleanableDecalsReduced
    - id: spray-rest
      text: tutorial-janitor-sg-spray-rest
      controlHint: tutorial-janitor-control-spray-rest
      complete: CleanableDecalsCleared

  - id: cleanade
    title: tutorial-janitor-goal-cleanade
    enterRoom: 9
    subGoals:
    - id: take-cleanade
      text: tutorial-janitor-sg-take-cleanade
      controlHint: tutorial-janitor-control-take-cleanade
      complete: HoldItem
      entity: TutorialJanitorCleanade
    - id: prime-cleanade
      text: tutorial-janitor-sg-prime-cleanade
      controlHint: tutorial-janitor-control-prime-cleanade
      complete: UseInHand
      entity: TutorialJanitorCleanade
    - id: throw-cleanade
      text: tutorial-janitor-sg-throw-cleanade
      controlHint: tutorial-janitor-control-throw-cleanade
      complete: ThrewItem
      entity: TutorialJanitorCleanade
    - id: mop-corners
      text: tutorial-janitor-sg-mop-corners
      controlHint: tutorial-janitor-control-mop-corners
      complete: PuddleCleared
      marker: janitor-cleanade
      # Foam and a mop both replace the mess with water. Water is slow to evaporate, so the tile does not have to dry.
      allowedReagent: Water

  - id: potassium
    title: tutorial-janitor-goal-potassium
    enterRoom: 10
    subGoals:
    - id: mop-potassium
      text: tutorial-janitor-sg-mop-potassium
      controlHint: tutorial-janitor-control-mop-potassium
      complete: TaggedReagentCleared
      tag: TutorialJanitorPotassium
      reagent: Potassium
      # Mopping detonates the spill and deletes it. A spray leaves water. Either one is done.
      clearedWhenAbsent: true
      usedTag: Mop
    - id: lecture
      text: tutorial-janitor-sg-lecture
      complete: Acknowledge
      autoAdvanceSeconds: 3
    - id: spray-potassium
      text: tutorial-janitor-sg-spray-potassium
      controlHint: tutorial-janitor-control-spray-potassium
      complete: TaggedReagentCleared
      tag: TutorialJanitorPotassium
      reagent: Potassium
      marker: janitor-potassium
      respawn: TutorialJanitorPotassiumSpill
      provideIfMissing: SprayBottleSpaceCleaner
      provideReagent: SpaceCleaner

  - id: finale
    title: tutorial-janitor-goal-finale
    enterRoom: 11
    subGoals:
    - id: fanfare
      text: tutorial-janitor-sg-fanfare
      complete: Acknowledge
      autoAdvanceSeconds: 3
    - id: wear-suit
      text: tutorial-janitor-sg-wear-suit
      controlHint: tutorial-janitor-control-wear-suit
      complete: WearItem
      # The pedestal has a jumpskirt beside the jumpsuit. Either one is the uniform.
      entity: ClothingUniformJumpsuitJanitor
      alsoEntities:
      - ClothingUniformJumpskirtJanitor
      slot: jumpsuit
    - id: cryo-tip
      text: tutorial-janitor-sg-cryo-tip
      complete: Acknowledge
      autoAdvanceSeconds: 3
